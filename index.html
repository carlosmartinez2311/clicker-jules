<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cookie Clicker</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #fef6e4 0%, #f3d299 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      user-select: none;
    }

    .container {
      background: rgba(255, 255, 255, 0.85);
      padding: 2.5rem;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      max-width: 400px;
      width: 90%;
      backdrop-filter: blur(10px);
    }

    h1 {
      color: #8d5b4c;
      font-size: 2rem;
      margin-bottom: 0.5rem;
    }

    .counter-display {
      font-size: 1.5rem;
      color: #5c3d2e;
      margin-bottom: 2rem;
      font-weight: 600;
    }

    .count {
      font-size: 2rem;
      color: #d97736;
      font-weight: bold;
    }

    .cookie-button {
      background: none;
      border: none;
      font-size: 8rem;
      cursor: pointer;
      outline: none;
      transition: transform 0.1s ease, filter 0.2s ease;
      display: inline-block;
      line-height: 1;
      margin: 1rem 0;
    }

    .cookie-button:hover {
      transform: scale(1.08);
      filter: drop-shadow(0 8px 16px rgba(141, 91, 76, 0.3));
    }

    .cookie-button:active {
      transform: scale(0.95);
    }

    .reset-btn {
      margin-top: 1.5rem;
      background-color: #8d5b4c;
      color: white;
      border: none;
      padding: 0.6rem 1.2rem;
      font-size: 0.9rem;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .reset-btn:hover {
      background-color: #6e4438;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Cookie Clicker</h1>
    <div class="counter-display">
      Clicks: <span id="count" class="count">0</span>
    </div>
    <button id="cookie-btn" class="cookie-button" aria-label="Click the cookie">🍪</button>
    <div>
      <button id="reset-btn" class="reset-btn">Reset Counter</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
